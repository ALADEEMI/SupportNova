[project]
name = "supportnova"
version = "0.1.0"
description = "SupportNova: Generative-AI complaint-resolution intelligence for Zephyra Electronics (Aptech Techwiz 7)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "documentation", "storage"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
explicit_package_bases = true
exclude = ['^\.venv/','^documentation/', '^storage/']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, isolated tests with no network or external services",
    "integration: tests that touch the database or several modules together",
    "e2e: end-to-end complaint flows through the service layer",
    "live_llm: calls the real GenAI API; skipped by default (make test excludes it)",
    "hidden: hidden-evaluation readiness packs",
]

[tool.coverage.run]
branch = true
source = [
    "src",
    "complaint_processing",
    "document_processing",
    "knowledge_base",
    "genai_pipeline",
    "python_validation",
    "comparison_engine",
    "hallucination_checks",
    "security",
    "database",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
